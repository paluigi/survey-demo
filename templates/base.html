<!doctype html>
<html lang="en" data-theme="light">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>{% block title %}Travel Survey{% endblock %}</title>
    <link rel="stylesheet" href="/static/vendor/pico.min.css">
    <link rel="stylesheet" href="/static/vendor/maplibre-gl.css">
    <link rel="stylesheet" href="/static/css/app.css">
    <script>
        (function () {
            var stored = localStorage.getItem("theme");
            var theme = stored === "dark" || stored === "light"
                ? stored
                : (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
            document.documentElement.setAttribute("data-theme", theme);
        })();
    </script>
</head>
<body>
    <nav class="container topbar">
        <div class="brand">
            <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"/></svg>
            <a href="/">Travel Survey</a>
        </div>
        <ul class="nav-links">
            <li><a href="/" {% if request.url.path == '/' %}aria-current="page"{% endif %}>Survey</a></li>
            <li><a href="/results" {% if request.url.path.startswith('/results') %}aria-current="page"{% endif %}>Results</a></li>
        </ul>
        <button id="theme-toggle" type="button" aria-label="Toggle dark / light mode" title="Toggle dark / light mode">
            <svg class="icon-sun" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><path d="M12 1v2m0 18v2M4.22 4.22l1.42 1.42m12.72 12.72 1.42 1.42M1 12h2m18 0h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
            <svg class="icon-moon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
    </nav>
    <main class="container">
        {% block content %}{% endblock %}
    </main>
    <footer class="container">
        <small>Demo survey app · FastAPI + MongoDB + htmx + Pico CSS + MapLibre GL · map geometry from Natural Earth (public domain)</small>
    </footer>
    <script src="/static/vendor/htmx.min.js" defer></script>
    <script src="/static/js/app.js" defer></script>
    <script src="/static/js/theme.js" defer></script>
    {% block scripts %}{% endblock %}
</body>
</html>

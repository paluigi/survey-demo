[project]
name = "survey-demo"
version = "1.0.0"
description = "Travel survey demo: FastAPI + MongoDB + htmx + Pico CSS + MapLibre GL"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Luigi Palumbo" }]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "jinja2>=3.1",
    "motor>=3.5",
    "orjson>=3.12.0",
    "pydantic>=2.8",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "black>=24.8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/survey"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# B008: Depends()/Form() in parameter defaults is the standard FastAPI idiom.
ignore = ["B008"]

[tool.black]
line-length = 100
target-version = ["py312"]
